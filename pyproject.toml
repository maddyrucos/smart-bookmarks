[project]
name = "smart-bookmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Igor", email = "maddyrucos@icloud.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.8",
    "openai>=3.42.1",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
smart-bookmarks = "smart_bookmarks:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
